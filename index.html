<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: none; }
  </style>
</head>
<body>
  <script>
    (function() {
      const ua = navigator.userAgent || '';

      function parseUA(uaString) {
        const result = {
          os: 'Unknown',
          device: 'Unknown',
          model: 'Unknown',
          browser: 'Unknown',
          browserVersion: 'Unknown',
          deviceType: 'Unknown'
        };

        if (!uaString) return result;

        // OS detection
        if (/Windows NT 10\.0/.test(uaString)) result.os = 'Windows 10';
        else if (/Windows NT 6\.3/.test(uaString)) result.os = 'Windows 8.1';
        else if (/Windows NT 6\.2/.test(uaString)) result.os = 'Windows 8';
        else if (/Windows NT 6\.1/.test(uaString)) result.os = 'Windows 7';
        else if (/Mac OS X 10_(\d+)_?(\d+)?/.test(uaString)) {
          const m = uaString.match(/Mac OS X 10_(\d+)_?(\d+)?/);
          result.os = 'macOS ' + (parseInt(m[1]) + 4).toString() + (m[2] ? '.' + m[2] : '');
        } else if (/iPhone OS (\d+)_(\d+)/.test(uaString)) {
          const m = uaString.match(/iPhone OS (\d+)_(\d+)/);
          result.os = 'iOS ' + m[1] + '.' + m[2];
        } else if (/iPad.*OS (\d+)_(\d+)/.test(uaString)) {
          const m = uaString.match(/OS (\d+)_(\d+)/);
          result.os = 'iPadOS ' + m[1] + '.' + m[2];
        } else if (/Android (\d+(\.\d+)*)/.test(uaString)) {
          const m = uaString.match(/Android (\d+(\.\d+)*)/);
          result.os = 'Android ' + m[1];
        } else if (/Linux/.test(uaString)) result.os = 'Linux';
        else if (/CrOS/.test(uaString)) result.os = 'Chrome OS';

        // Device detection
        if (/iPhone/.test(uaString)) {
          result.device = 'iPhone';
          result.deviceType = 'phone';
        } else if (/iPad/.test(uaString) || (/Macintosh/.test(uaString) && navigator.maxTouchPoints > 1)) {
          result.device = 'iPad';
          result.deviceType = 'tablet';
        } else if (/Android/.test(uaString)) {
          result.device = 'Android';
          result.deviceType = /Mobile/.test(uaString) ? 'phone' : 'tablet';
        } else if (/Windows/.test(uaString)) {
          result.device = 'Desktop';
          result.deviceType = 'desktop';
        } else if (/Macintosh/.test(uaString)) {
          result.device = 'Desktop';
          result.deviceType = 'desktop';
        } else if (/Linux/.test(uaString)) {
          result.device = 'Desktop';
          result.deviceType = 'desktop';
        }

        // Model extraction for Android
        if (/Android/.test(uaString)) {
          const modelMatch = uaString.match(/\((?:Linux; )?Android [^;]*; ([^;)]+)/);
          if (modelMatch && modelMatch[1]) {
            result.model = modelMatch[1].trim();
          }
        }

        // Browser detection
        if (/Edg\/(\d+\.\d+\.\d+\.\d+)/.test(uaString)) {
          const m = uaString.match(/Edg\/(\d+\.\d+\.\d+\.\d+)/);
          result.browser = 'Edge';
          result.browserVersion = m[1];
        } else if (/Chrome\/(\d+\.\d+\.\d+\.\d+)/.test(uaString) && !/Edg|OPR|Vivaldi|Brave/.test(uaString)) {
          const m = uaString.match(/Chrome\/(\d+\.\d+\.\d+\.\d+)/);
          result.browser = 'Chrome';
          result.browserVersion = m[1];
        } else if (/Firefox\/(\d+\.\d+)/.test(uaString)) {
          const m = uaString.match(/Firefox\/(\d+\.\d+)/);
          result.browser = 'Firefox';
          result.browserVersion = m[1];
        } else if (/Safari\/(\d+\.\d+)/.test(uaString) && !/Chrome|CriOS|FxiOS|Edg|OPR|Vivaldi|Brave/.test(uaString)) {
          const m = uaString.match(/Version\/(\d+\.\d+)/);
          result.browser = 'Safari';
          result.browserVersion = m ? m[1] : 'Unknown';
        } else if (/CriOS\/(\d+\.\d+\.\d+\.\d+)/.test(uaString)) {
          const m = uaString.match(/CriOS\/(\d+\.\d+\.\d+\.\d+)/);
          result.browser = 'Chrome';
          result.browserVersion = m[1];
        } else if (/FxiOS\/(\d+\.\d+)/.test(uaString)) {
          const m = uaString.match(/FxiOS\/(\d+\.\d+)/);
          result.browser = 'Firefox';
          result.browserVersion = m[1];
        } else if (/OPR\/(\d+\.\d+\.\d+\.\d+)/.test(uaString)) {
          const m = uaString.match(/OPR\/(\d+\.\d+\.\d+\.\d+)/);
          result.browser = 'Opera';
          result.browserVersion = m[1];
        } else if (/Vivaldi\/(\d+\.\d+\.\d+\.\d+)/.test(uaString)) {
          const m = uaString.match(/Vivaldi\/(\d+\.\d+\.\d+\.\d+)/);
          result.browser = 'Vivaldi';
          result.browserVersion = m[1];
        } else if (/Brave/.test(uaString) && /Chrome\/(\d+\.\d+\.\d+\.\d+)/.test(uaString)) {
          const m = uaString.match(/Chrome\/(\d+\.\d+\.\d+\.\d+)/);
          result.browser = 'Brave';
          result.browserVersion = m[1];
        }

        return result;
      }

      const parsed = parseUA(ua);

      let finalData = { ...parsed, rawUa: ua };

      // Step 2: Client Hints upgrade
      if (navigator.userAgentData) {
        const uad = navigator.userAgentData;

        // Immediate values
        if (uad.platform) {
          finalData.os = uad.platform;
        }
        if (typeof uad.mobile === 'boolean') {
          finalData.deviceType = uad.mobile ? 'phone' : 'desktop';
        }
        if (uad.brands && uad.brands.length) {
          const primary = uad.brands[0];
          finalData.browser = primary.brand;
          finalData.browserVersion = primary.version;
        }

        // High entropy values
        try {
          uad.getHighEntropyValues(["model", "platformVersion", "fullVersionList"]).then(highEntropy => {
            if (highEntropy.model && highEntropy.model !== '') {
              finalData.model = highEntropy.model;
            }

            if (highEntropy.platformVersion) {
              let osVersion = highEntropy.platformVersion;
              if (highEntropy.platform === 'Windows') {
                const major = parseInt(osVersion.split('.')[0], 10);
                osVersion = major >= 13 ? 'Windows 11' : 'Windows 10';
              }
              finalData.os = highEntropy.platform + ' ' + osVersion;
              finalData.platformVersion = highEntropy.platformVersion;
            }

            if (highEntropy.fullVersionList && highEntropy.fullVersionList.length) {
              const primary = highEntropy.fullVersionList[0];
              finalData.browser = primary.brand;
              finalData.browserVersion = primary.version;
            }

            sendLog(finalData);
          }).catch(() => {
            sendLog(finalData);
          });
        } catch (e) {
          sendLog(finalData);
        }
      } else {
        // No Client Hints support
        sendLog(finalData);
      }

      function sendLog(data) {
        const payload = {
          rawUa: data.rawUa,
          os: data.os,
          device: data.device,
          model: data.model,
          browser: data.browser,
          browserVersion: data.browserVersion,
          deviceType: data.deviceType,
          platformVersion: data.platformVersion || null,
          screenWidth: window.screen.width,
          screenHeight: window.screen.height,
          language: navigator.language || '',
          timestamp: new Date().toISOString()
        };

        // Rate limiting: only send once per 10 seconds per session
        const lastSent = sessionStorage.getItem('ua_last_sent');
        const now = Date.now();
        if (lastSent && now - parseInt(lastSent, 10) < 10000) {
          return;
        }
        sessionStorage.setItem('ua_last_sent', now.toString());

        fetch('/api/log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          keepalive: true
        }).catch(() => {
          // Fail silently
        });
      }
    })();
  </script>
</body>
</html>
